<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Patients</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/patients">Patients</a>
    <a href="/logout">Logout</a>
  </nav>

  <div class="container">
    <h1>Patients</h1>
    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>MRN</th><th>Diagnosis</th></tr>
      </thead>
      <tbody>
        {% for p in patients %}
          <tr>
            <td>{{ p["id"] }}</td>
            <td><a href="/patient/{{ p['id'] }}">{{ p["first_name"] }} {{ p["last_name"] }}</a></td>
            <td>{{ p["mrn"] }}</td>
            <td>{{ p["diagnosis"] }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
